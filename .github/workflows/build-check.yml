name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Zero/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Zero
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: Zero
        run: pnpm check:format

      - name: Lint (OxLint)
        working-directory: Zero
        run: pnpm dlx oxlint@latest --deny-warnings

      - name: Lint (ESLint)
        working-directory: Zero
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Zero/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Zero
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: Zero
        run: pnpm build:frontend
        env:
          VITE_PUBLIC_BACKEND_URL: https://api.solmail.xyz
          VITE_PUBLIC_APP_URL: https://solmail.xyz

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Zero/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Zero
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: Zero
        run: pnpm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Zero/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Zero
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        working-directory: Zero
        run: pnpm audit --prod
        continue-on-error: true
